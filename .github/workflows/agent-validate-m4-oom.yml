name: Validate Murphy M4 OOM fix

on:
  push:
    branches:
      - agent/fix-m4-internal-oom-phase1

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-m4-internal-oom-phase1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio

      - name: Build murphy_m4
        id: build
        shell: bash
        run: |
          set +e
          python -m platformio run -e murphy_m4 2>&1 | tee /tmp/m4-build.log
          status=${PIPESTATUS[0]}
          echo "$status" > /tmp/m4-build-status
          if [ "$status" -eq 0 ]; then
            echo "result=passed" >> "$GITHUB_OUTPUT"
          else
            echo "result=failed" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Report result on draft PR
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.build.outputs.result }}
        shell: bash
        run: |
          if [ "$RESULT" = "passed" ]; then
            body='Automated `murphy_m4` PlatformIO validation: ✅ build passed.'
          else
            tail -n 60 /tmp/m4-build.log > /tmp/m4-tail.txt || true
            body=$(printf 'Automated `murphy_m4` PlatformIO validation: ❌ build failed.\n\n```text\n%s\n```' "$(cat /tmp/m4-tail.txt)")
          fi
          gh api repos/einklover/m4-firmware/issues/3/comments -f body="$body"

      - name: Remove temporary validation workflow
        if: always()
        shell: bash
        run: |
          rm -f .github/workflows/agent-validate-m4-oom.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "remove temporary M4 validation workflow"
            git push origin HEAD:agent/fix-m4-internal-oom-phase1
          fi

      - name: Fail job if build failed
        if: always()
        shell: bash
        run: |
          status=$(cat /tmp/m4-build-status 2>/dev/null || echo 1)
          exit "$status"
