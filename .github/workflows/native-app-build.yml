name: Native App Build

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'lib/**'
      - 'platformio.ini'
      - '.github/workflows/native-app-build.yml'
  workflow_dispatch:

jobs:
  murphy-m4:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio==6.1.18

      - name: Build Murphy M4
        run: pio run -e murphy_m4

  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Run existing host tests
        shell: bash
        run: |
          set -euo pipefail
          if [ -x tests/run_tests.sh ]; then
            tests/run_tests.sh
          elif [ -x test/run_tests.sh ]; then
            test/run_tests.sh
          else
            echo 'No aggregate host-test runner found; build job remains authoritative.'
          fi
